<text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="284.6094" x="634.2266" y="487.9551">RA01: Una pr&#225;ctica ocupa entre</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="224.5801" x="634.2266" y="510.9531">1 y 20 horas a la semana</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="385.7617" x="634.2266" y="533.9512">RA02: Solo se es EXPERTO en una afici&#243;n</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="332.4414" x="634.2266" y="556.9492">a la que se dedican al menos 5 horas</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="404.6875" x="634.2266" y="579.9473">RA03: Un usuario no dedica m&#225;s de 30 horas</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="322.4121" x="634.2266" y="602.9453">a la semana al total de sus aficiones</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="313.4766" x="634.2266" y="625.9434">RA04: Un usuario no es EXPERTO</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="215.6836" x="634.2266" y="648.9414">en m&#225;s de dos aficiones</text></g><!--link Usuario to apoint7--><g id="link_Usuario_apoint7"><path d="M173.58,290.3573 C145.52,388.2973 106.04,526.1173 100.62,545.0173 " fill="none" id="Usuario-apoint7" style="stroke:#8C0000;stroke-width:2.0;"/><polygon fill="#222222" points="161.7966,371.3869,170.303,358.7696,161.2621,356.1794,161.7966,371.3869" style="stroke:#222222;stroke-width:2.0;"/><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="127.8613" x="178" y="370.957">esAficionadoA</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="30.0195" x="137.6929" y="324.2834">0..*</text></g><!--